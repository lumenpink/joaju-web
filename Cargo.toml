[package]
name = "joaju-web"
version = "0.1.0"
edition = "2021"
description = "HTTP microservice, Axum daemon, and web playground for the Joaju academic compiler"
license = "Apache-2.0"
repository = "https://codeberg.org/lumenpink/joaju-web"
homepage = "https://joaju.2lp.in"
documentation = "https://docs.rs/joaju-web"
readme = "README.md"
keywords = ["axum", "joaju", "compiler", "academic", "playground"]
categories = ["web-programming::http-server", "command-line-utilities"]
authors = ["Lumen Pink <hi@lumen.pink>"]

[lib]
name = "joaju_web"
path = "src/lib.rs"

[[bin]]
name = "joaju-web"
path = "src/main.rs"

[dependencies]
joaju = { version = "0.1.0", registry = "lumen" }
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "fs", "trace"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
