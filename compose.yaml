services:
  # Joaju Web HTTP service (Pure Rust Axum daemon + static assets)
  joaju:
    image: lumenpink/joaju-web:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: joaju
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
    volumes:
      - ./data:/data
    networks:
      - joaju_net

networks:
  joaju_net:
    driver: bridge
