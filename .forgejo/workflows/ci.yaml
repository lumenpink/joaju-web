name: CI, Build & Sovereign CD

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check-and-test:
    name: "Rust — Checks & Unit Tests"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Setup Rust Toolchain"
        run: |
          if ! command -v cargo >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --profile minimal
            echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          fi

      - name: "Configure Sovereign Lumen Cargo Registry"
        run: |
          mkdir -p "$HOME/.cargo"
          cat <<'EOF' > "$HOME/.cargo/config.toml"
[registries.lumen]
index = "sparse+https://git.2lp.in/api/packages/lumen/cargo/"
EOF

      - name: "GitOps — Update Sovereign Joaju Dependency"
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo "-> GitOps dispatch recebido: atualizando joaju a partir do registry lumen..."
          cargo update -p joaju
          if ! git diff --quiet Cargo.lock; then
            echo "-> Alteracoes detectadas em Cargo.lock. Commitando..."
            git config user.name "Lumen Pink (Baquara)"
            git config user.email "hi@lumen.pink"
            git commit -m "chore(deps): atualizar joaju para versao mais recente [skip ci]"
            if [ -n "${{ secrets.CODEBERG_TOKEN }}" ]; then
              git push "https://x-access-token:${{ secrets.CODEBERG_TOKEN }}@codeberg.org/lumenpink/joaju-web.git" main || true
            fi
          else
            echo "-> Nenhuma alteracao em Cargo.lock detectada."
          fi

      - name: "Format Check"
        run: cargo fmt -- --check

      - name: "Clippy Check (Zero Warnings)"
        run: cargo clippy --all-targets -- -D warnings

      - name: "Run Unit & Integration Tests"
        run: cargo test

      - name: "Audit Sovereign CD Workflow & Registry"
        run: bash tests/audit_registry_and_cd.sh

      - name: "Audit GitOps Cascade Integration"
        run: bash tests/audit_gitops_dispatch.sh

      - name: "CCCP Quality Audit"
        run: |
          if command -v cccp >/dev/null 2>&1; then
            cccp check --strict
          fi

  build-and-deploy-docker:
    name: "Container — Build & Sovereign CD (obizero)"
    runs-on: ubuntu-latest
    needs: [check-and-test]
    if: (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4

      - name: "Build local Docker Image"
        run: |
          OLD_IMAGE_ID=$(docker inspect --format='{{.Id}}' lumenpink/joaju-web:latest 2>/dev/null || true)
          echo "OLD_IMAGE_ID=$OLD_IMAGE_ID" >> $GITHUB_ENV
          docker build -t lumenpink/joaju-web:latest -f ./Dockerfile .

      - name: "Login to Docker Hub (Registry Backup)"
        if: env.DOCKER_PASSWORD != ''
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin

      - name: "Push Image to Docker Hub (Registry Backup)"
        if: env.DOCKER_PASSWORD != ''
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          docker push lumenpink/joaju-web:latest

      - name: "Deploy Locally on obizero (Direct Socket)"
        run: |
          echo "-> Aplicando atualização local no runtime Docker do obizero..."
          docker compose -f /home/lumen/src/joaju-web/compose.yaml up -d --no-build joaju

      - name: "Active Healthcheck & Rollback Protocol"
        run: |
          echo "-> Sondando estabilidade do container joaju (polling 15s)..."
          SUCCESS=0
          for i in $(seq 1 15); do
            STATUS=$(docker inspect --format='{{.State.Status}}' joaju 2>/dev/null || echo "unknown")
            if [ "$STATUS" = "running" ]; then
              echo "  [PASS] Container joaju saudável e ativo (tentativa $i/15)."
              SUCCESS=1
              break
            fi
            sleep 1
          done

          if [ $SUCCESS -ne 1 ]; then
            echo "✘ [FALHA] Container não estabilizou no prazo limite! Acionando Rollback..."
            if [ -n "$OLD_IMAGE_ID" ]; then
              docker tag "$OLD_IMAGE_ID" lumenpink/joaju-web:latest
              docker compose -f /home/lumen/src/joaju-web/compose.yaml up -d --no-build joaju
              echo "✔ Rollback concluído para imagem anterior $OLD_IMAGE_ID."
            fi
            exit 1
          fi

      - name: "Prune Orphan Docker Layers"
        run: |
          docker image prune -f
